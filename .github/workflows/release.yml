name: Release

# Ao criar uma tag v* (ex.: git tag v0.1.0 && git push origin v0.1.0),
# gera o .deb (Linux) e os instaladores do Windows (.msi e .exe) e publica numa Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb
          - os: windows-latest
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do Linux
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # O instalador usa a versão do tauri.conf.json: sincroniza com a tag (v0.2.0 -> 0.2.0).
      - name: Versão a partir da tag
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          node -e "const f='src-tauri/tauri.conf.json',c=JSON.parse(require('fs').readFileSync(f));c.version=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(c,null,2)+'\n')" "$v"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Orchestra ${{ github.ref_name }}"
          releaseBody: "Baixe o instalador do seu sistema abaixo."
          releaseDraft: false
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
